<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>짤 수정</title>
</head>
<body>
  <h1>짤 수정</h1>

  <img src="/images/{{ item.image }}" style="max-width:300px"><br><br>

  <form method="post">
    <div>
      <label>제목</label><br>
      <input type="text" name="title" value="{{ item.title }}" required>
    </div>

    <div>
      <label>meta (쉼표 구분)</label><br>
      <input
        type="text"
        name="meta"
        value="{{ ', '.join(item.meta) }}"
      >
    </div>

    <button type="submit">저장</button>
  </form>

  <p><a href="/">← 돌아가기</a></p>
</body>
</html>
